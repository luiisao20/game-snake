<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Clásico - Snake</title>
    <!-- Fuente pixelada clásica de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #111;
            --text-color: #39ff14; /* Verde neón clásico */
            --accent-color: #ff003c; /* Rojo arcade */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            text-align: center;
            text-shadow: 2px 2px 0px var(--accent-color), -2px -2px 0px #00f3ff;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .arcade-container {
            background: #222;
            padding: 20px;
            border-radius: 15px;
            border: 4px solid #444;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), inset 0 0 10px #000;
            position: relative;
        }

        /* Contenedor de la pantalla con efecto CRT */
        .screen-container {
            position: relative;
            border: 10px solid #000;
            border-radius: 10px;
            overflow: hidden;
            background-color: #000;
        }

        canvas {
            display: block;
            background-color: #000;
        }

        /* Efecto de líneas de escaneo de monitores antiguos */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        /* Efecto de parpadeo suave y viñeta */
        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 11;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.95; }
            50% { opacity: 0.85; }
            100% { opacity: 0.95; }
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 14px;
        }

        .instructions {
            margin-top: 25px;
            font-size: 10px;
            color: #888;
            text-align: center;
            line-height: 1.5;
        }

        .blink {
            animation: blinker 1s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div>
        <h1>SNAKE CLASSIC</h1>
        <div class="arcade-container">
            <div class="screen-container">
                <canvas id="gameCanvas" width="400" height="400"></canvas>
                <div class="scanlines"></div>
                <div class="crt-overlay"></div>
            </div>
            <div class="stats">
                <span>SCORE: <span id="score">0</span></span>
                <span>HI-SCORE: <span id="hiScore">0</span></span>
            </div>
        </div>
        <div class="instructions">
            <p class="blink">INSERT COIN TO PLAY</p>
            <p>Usa las FLECHAS del teclado para moverte.</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const hiScoreElement = document.getElementById('hiScore');

        // Configuración del juego
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        let speed = 7;
        let score = 0;
        let hiScore = localStorage.getItem('snakeHiScore') || 0;
        hiScoreElement.innerText = hiScore;

        // Variables de la serpiente
        let snake = [];
        let snakeLength = 4;
        let headX = 10;
        let headY = 10;
        let velocityX = 0;
        let velocityY = 0;

        // Comida
        let appleX = 5;
        let appleY = 5;

        // Loop principal del juego
        function drawGame() {
            changeSnakePosition();
            let result = isGameOver();
            if (result) {
                return;
            }

            clearScreen();
            checkAppleCollision();
            drawApple();
            drawSnake();
            
            setTimeout(drawGame, 1000 / speed);
        }

        function isGameOver() {
            let gameOver = false;

            if (velocityX === 0 && velocityY === 0) return false;

            // Chocar contra paredes
            if (headX < 0 || headX === tileCount || headY < 0 || headY === tileCount) {
                gameOver = true;
            }

            // Chocar contra sí misma
            for (let i = 0; i < snake.length; i++) {
                let part = snake[i];
                if (part.x === headX && part.y === headY) {
                    gameOver = true;
                    break;
                }
            }

            if (gameOver) {
                ctx.fillStyle = "white";
                ctx.font = "20px 'Press Start 2P'";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2);
                ctx.font = "10px 'Press Start 2P'";
                ctx.fillText("Presiona F5 para reiniciar", canvas.width / 2, canvas.height / 2 + 30);
            }

            return gameOver;
        }

        function clearScreen() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            ctx.fillStyle = '#39ff14'; // Verde neón
            for (let i = 0; i < snake.length; i++) {
                let part = snake[i];
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            }

            snake.push({ x: headX, y: headY });
            while (snake.length > snakeLength) {
                snake.shift();
            }

            ctx.fillStyle = '#fff'; // Cabeza blanca
            ctx.fillRect(headX * gridSize, headY * gridSize, gridSize - 2, gridSize - 2);
        }

        function changeSnakePosition() {
            headX = headX + velocityX;
            headY = headY + velocityY;
        }

        function drawApple() {
            ctx.fillStyle = '#ff003c'; // Manzana roja
            ctx.fillRect(appleX * gridSize, appleY * gridSize, gridSize - 2, gridSize - 2);
        }

        function checkAppleCollision() {
            if (appleX === headX && appleY == headY) {
                appleX = Math.floor(Math.random() * tileCount);
                appleY = Math.floor(Math.random() * tileCount);
                snakeLength++;
                score += 10;
                scoreElement.innerText = score;
                speed += 0.2; // Aumenta la velocidad ligeramente

                if (score > hiScore) {
                    hiScore = score;
                    hiScoreElement.innerText = hiScore;
                    localStorage.setItem('snakeHiScore', hiScore);
                }
            }
        }

        document.body.addEventListener('keydown', keyDown);

        function keyDown(event) {
            // Arriba
            if (event.keyCode == 38 && velocityY != 1) {
                velocityY = -1;
                velocityX = 0;
            }
            // Abajo
            if (event.keyCode == 40 && velocityY != -1) {
                velocityY = 1;
                velocityX = 0;
            }
            // Izquierda
            if (event.keyCode == 37 && velocityX != 1) {
                velocityY = 0;
                velocityX = -1;
            }
            // Derecha
            if (event.keyCode == 39 && velocityX != -1) {
                velocityY = 0;
                velocityX = 1;
            }
        }

        // Iniciar el juego
        drawGame();
    </script>
</body>
</html>
